[project]
name = "pi-board"
version = "0.1.0"
description = "Pi-Board: a Raspberry Pi wall dashboard (posters, todo, calendar, news, etc.)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pi-Board Contributors" }]
dependencies = [
  "Flask>=3.0.0",
  "Pillow>=10.0.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  ".piboard",
  "posters",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
